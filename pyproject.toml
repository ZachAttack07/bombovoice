[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bombovoice"
version = "1.0.0"
description = "Jamaican voice changer: live sing-song voice FX, AI Patois director, dancehall soundboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
    "pydantic>=2",
]

[project.optional-dependencies]
ai = ["anthropic>=1.0", "faster-whisper>=1.0", "edge-tts>=6.1", "praat-parselmouth>=0.4.3"]
offline-voice = ["pyttsx3>=2.90"]
hotkeys = ["pynput>=1.7"]
# GPU AI voice (RVC) + voice cloning (XTTS). Install PyTorch with CUDA FIRST (setup_gpu.bat does this),
# otherwise pip pulls a CPU-only build on Windows.
gpu = ["transformers>=4.57,<5", "librosa>=0.10", "huggingface_hub>=0.24", "coqui-tts>=0.27", "faiss-cpu>=1.8"]
all = ["anthropic>=1.0", "faster-whisper>=1.0", "edge-tts>=6.1", "praat-parselmouth>=0.4.3", "pyttsx3>=2.90", "pynput>=1.7"]
dev = ["pytest>=7"]

[project.scripts]
bombovoice = "bombovoice.cli:main"

[tool.setuptools]
packages = ["bombovoice", "bombovoice.rvc"]

[tool.setuptools.package-data]
"bombovoice.rvc" = ["LICENSE-infer-rvc-python.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# vendored third-party RVC model code, kept as close to upstream as possible
extend-exclude = ["bombovoice/rvc/commons.py", "bombovoice/rvc/transforms.py", "bombovoice/rvc/modules.py",
                  "bombovoice/rvc/attentions.py", "bombovoice/rvc/models.py", "bombovoice/rvc/rmvpe.py"]
