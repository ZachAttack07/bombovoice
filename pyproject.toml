[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bombovoice"
version = "1.0.0"
description = "Jamaican voice changer: live sing-song voice FX, AI Patois director, dancehall soundboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
    "pydantic>=2",
]

[project.optional-dependencies]
ai = ["anthropic>=1.0", "faster-whisper>=1.0", "edge-tts>=6.1"]
offline-voice = ["pyttsx3>=2.90"]
hotkeys = ["pynput>=1.7"]
all = ["anthropic>=1.0", "faster-whisper>=1.0", "edge-tts>=6.1", "pyttsx3>=2.90", "pynput>=1.7"]
dev = ["pytest>=7"]

[project.scripts]
bombovoice = "bombovoice.cli:main"

[tool.setuptools]
packages = ["bombovoice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
